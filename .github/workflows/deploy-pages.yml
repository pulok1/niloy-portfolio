name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build static site
        run: npm run build
        env:
          # Defaults suit https://<user>.github.io/<repo>. Optional repository variables
          # (Settings → Secrets and variables → Actions → Variables):
          #   NEXT_PUBLIC_SITE_URL           e.g. https://niloy.example.com (custom domain)
          #   USE_ROOT_PATH=true             serve from "/" (custom domain or <user>.github.io repo)
          #   NEXT_PUBLIC_HIDE_PLACEHOLDERS  "true" hides unfilled TODO badges
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.USE_ROOT_PATH == 'true' && '' || steps.pages.outputs.base_path }}
          NEXT_PUBLIC_HIDE_PLACEHOLDERS: ${{ vars.NEXT_PUBLIC_HIDE_PLACEHOLDERS || 'false' }}

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
